  localhost: "/nfs/disk3/mukund/DataFiles"
  lxplus:    "/eos/user/m/mshelake/DataFiles"

REPO_ROOT:
  cms2: "/home/mukund/Projects/PhysicsTools/NanoAODTools"
  lxplus: "/eos/user/m/mshelake/PhysicsTools/NanoAODTools"
  localhost: "/home/irfan/mukund/Projects/PhysicsTools/NanoAODTools"

LFN_Base : "/store/user/mshelake/DataFiles"
# ---------------------------------------------------------------------------
# Golden JSON URLs per era (run_all.py --downloadGoldenJSONs). Same CMS-published
# files 003-ObjectSelectionI uses -- content only depends on era, not on any
# particular 003-ObjectSelectionI run, so this chapter downloads them directly
# rather than fetching a copy from 003-ObjectSelectionI's own output.
golden_json_urls:
  "UL2016preVFP": "https://cms-service-dqmdc.web.cern.ch/CAF/certification/Collisions16/13TeV/Legacy_2016/Cert_271036-284044_13TeV_Legacy2016_Collisions16_JSON.txt"
  "UL2016postVFP": "https://cms-service-dqmdc.web.cern.ch/CAF/certification/Collisions16/13TeV/Legacy_2016/Cert_271036-284044_13TeV_Legacy2016_Collisions16_JSON.txt"
  "UL2017": "https://cms-service-dqmdc.web.cern.ch/CAF/certification/Collisions17/13TeV/Legacy_2017/Cert_294927-306462_13TeV_UL2017_Collisions17_GoldenJSON.txt"
  "UL2018": "https://cms-service-dqmdc.web.cern.ch/CAF/certification/Collisions18/13TeV/Legacy_2018/Cert_314472-325175_13TeV_Legacy2018_Collisions18_JSON.txt"
# ---------------------------------------------------------------------------
# Where to fetch correctionlib SF files from (run_all.py --fetchSFFiles), keyed
# the same way as STORAGE -- a substring of socket.gethostname(). Only lxplus is
# confirmed to have this CVMFS mount; add other machines here once verified.
SFSource:
  lxplus: "/cvmfs/cms.cern.ch/rsync/cms-nanoAOD/jsonpog-integration/POG"
# Fallback for any machine not listed in SFSource above (no local CVMFS mount): relay
# the fetch through this host over SSH instead (reusing SFSource.lxplus's path as it
# exists there). Runs interactively -- expect a password/2FA prompt on first use.
SFSourceSSHRelay: "lxplus.cern.ch"
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Which modules run on MC vs Data.
# All SF modules are MC-only; Data only gets GoldenJSON filtering (no modules).
# ---------------------------------------------------------------------------
ModuleList:
  MC:   [lheWeightSign, puWeight, muonID, muonIso, muonHLT, bTagging, jetPUID]
  Data: []

# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# Per-module configuration. Each module's config dict is passed directly to
# its constructor. Era-dependent fields are nested under the era key.
# ---------------------------------------------------------------------------
Modules:
  # ---------- LHEWeightSign ------------------------------------------------
  # Reads LHEWeight_originalXWGTUP and stores its sign.
  # Era-independent.
  lheWeightSign:
    UL2016preVFP:
      branchNames:
        sf: "lheWeightSign"
    UL2016postVFP:
      branchNames:
        sf: "lheWeightSign"
    UL2017:
      branchNames:
        sf: "lheWeightSign"
    UL2018:
      branchNames:
        sf: "lheWeightSign"

  # ---------- PUWeight -------------------------------------------------------
  # Pileup reweighting from Pileup_nTrueInt + the LUM POG's puWeights.json.gz.
  # See PUWeight.py's docstring: correction names below are a best-guess
  # standard jsonpog-integration convention, NOT yet verified against the real
  # file (no /cvmfs access when this was written) -- confirm with
  # correctionlib.CorrectionSet.from_file(path).keys() once fetched, and fix
  # here if different. Also needs a 002-Samples reprocessing run before
  # Pileup_nTrueInt actually reaches this module on any skim.
  puWeight:
    UL2016preVFP:
      PUSFFile: "inputs/SFs/UL2016preVFP_pu_Weights.json"
      correctionLib:
        weightName: "Collisions16_UltraLegacy_goldenJSON"
      branchNames:
        sf:     "puWeight"
        sfup:   "puWeightUp"
        sfdown: "puWeightDown"
    UL2016postVFP:
      PUSFFile: "inputs/SFs/UL2016postVFP_pu_Weights.json"
      correctionLib:
        weightName: "Collisions16_UltraLegacy_goldenJSON"
      branchNames:
        sf:     "puWeight"
        sfup:   "puWeightUp"
        sfdown: "puWeightDown"
    UL2017:
      PUSFFile: "inputs/SFs/UL2017_pu_Weights.json"
      correctionLib:
        weightName: "Collisions17_UltraLegacy_goldenJSON"
      branchNames:
        sf:     "puWeight"
        sfup:   "puWeightUp"
        sfdown: "puWeightDown"
    UL2018:
      PUSFFile: "inputs/SFs/UL2018_pu_Weights.json"
      correctionLib:
        weightName: "Collisions18_UltraLegacy_goldenJSON"
      branchNames:
        sf:     "puWeight"
        sfup:   "puWeightUp"
        sfdown: "puWeightDown"

  # ---------- MuonIDWeight -------------------------------------------------
  # Correctionlib-based tight muon ID scale factor.
  # Evaluated on the leading muon passing kinematic cuts.
  muonID:
    UL2016preVFP:
      IDSFFile: "inputs/SFs/UL2016preVFP_mu_ID.json"
      selMuonBranch: "SelMuon"
      correctionLib:
        weightName: "NUM_TightID_DEN_TrackerMuons"
        eraName:    "2016preVFP_UL"
      branchNames:
        sf:     "muonIDWeight"
        sfup:   "muonIDWeightUp"
        sfdown: "muonIDWeightDown"
    UL2016postVFP:
      IDSFFile: "inputs/SFs/UL2016postVFP_mu_ID.json"
      selMuonBranch: "SelMuon"
      correctionLib:
        weightName: "NUM_TightID_DEN_TrackerMuons"
        eraName:    "2016postVFP_UL"
      branchNames:
        sf:     "muonIDWeight"
        sfup:   "muonIDWeightUp"
        sfdown: "muonIDWeightDown"
    UL2017:
      IDSFFile: "inputs/SFs/UL2017_mu_ID.json"
      selMuonBranch: "SelMuon"
      correctionLib:
        weightName: "NUM_TightID_DEN_TrackerMuons"
        eraName:    "2017_UL"
      branchNames:
        sf:     "muonIDWeight"
        sfup:   "muonIDWeightUp"
        sfdown: "muonIDWeightDown"
    UL2018:
      IDSFFile: "inputs/SFs/UL2018_mu_ID.json"
      selMuonBranch: "SelMuon"
      correctionLib:
        weightName: "NUM_TightID_DEN_TrackerMuons"
        eraName:    "2018_UL"
      branchNames:
        sf:     "muonIDWeight"
        sfup:   "muonIDWeightUp"
        sfdown: "muonIDWeightDown"

  # ---------- MuonIsoWeight -------------------------------------------------
  # Muon isolation-selection-efficiency scale factor. This analysis's ABCD
  # method (see 003-ObjectSelectionI's SelectedObjectsProducer) tags every
  # selected muon as "tight iso" (pfRelIso04_all < 0.06, regions A/C) or
  # "loose iso" (>= 0.06, regions B/D). MuonIsoWeightProducer picks its
  # source per event from ABCD_isTightIso:
  #   tight iso -> TightIsoSFFile, a dedicated 0.06-WP TnP ROOT file (not
  #                correctionlib) obtained outside the standard POG set,
  #                since the POG JSON only measures the standard 0.15 WP.
  #   loose iso -> StandardSFFile/correctionLib.weightName below (the same
  #                mu_ID.json NUM_TightRelIso_DEN_TightIDandIPCut key
  #                muonID could reach), used as the best available proxy.
  muonIso:
    UL2016preVFP:
      StandardSFFile: "inputs/SFs/UL2016preVFP_mu_ID.json"
      TightIsoSFFile: "inputs/SFs/UL2016preVFP_mu_Iso_0p06.root"
      selMuonBranch: "SelMuon"
      abcdTightIsoBranch: "ABCD_isTightIso"
      correctionLib:
        weightName:   "NUM_TightRelIso_DEN_TightIDandIPCut"
        rootHistName: "NUM_VeryTightRelIso_DEN_TightIDandIPCut_abseta_pt"
      branchNames:
        sf:     "muonIsoWeight"
        sfstat: "muonIsoWeightStat"
        sfsyst: "muonIsoWeightSyst"
    UL2016postVFP:
      StandardSFFile: "inputs/SFs/UL2016postVFP_mu_ID.json"
      TightIsoSFFile: "inputs/SFs/UL2016postVFP_mu_Iso_0p06.root"
      selMuonBranch: "SelMuon"
      abcdTightIsoBranch: "ABCD_isTightIso"
      correctionLib:
        weightName:   "NUM_TightRelIso_DEN_TightIDandIPCut"
        rootHistName: "NUM_VeryTightRelIso_DEN_TightIDandIPCut_abseta_pt"
      branchNames:
        sf:     "muonIsoWeight"
        sfstat: "muonIsoWeightStat"
        sfsyst: "muonIsoWeightSyst"
    UL2017:
      StandardSFFile: "inputs/SFs/UL2017_mu_ID.json"
      TightIsoSFFile: "inputs/SFs/UL2017_mu_Iso_0p06.root"
      selMuonBranch: "SelMuon"
      abcdTightIsoBranch: "ABCD_isTightIso"
      correctionLib:
        weightName:   "NUM_TightRelIso_DEN_TightIDandIPCut"
        rootHistName: "NUM_VeryTightRelIso_DEN_TightIDandIPCut_abseta_pt"
      branchNames:
        sf:     "muonIsoWeight"
        sfstat: "muonIsoWeightStat"
        sfsyst: "muonIsoWeightSyst"
    UL2018:
      StandardSFFile: "inputs/SFs/UL2018_mu_ID.json"
      TightIsoSFFile: "inputs/SFs/UL2018_mu_Iso_0p06.root"
      selMuonBranch: "SelMuon"
      abcdTightIsoBranch: "ABCD_isTightIso"
      correctionLib:
        weightName:   "NUM_TightRelIso_DEN_TightIDandIPCut"
        rootHistName: "NUM_VeryTightRelIso_DEN_TightIDandIPCut_abseta_pt"
      branchNames:
        sf:     "muonIsoWeight"
        sfstat: "muonIsoWeightStat"
        sfsyst: "muonIsoWeightSyst"

  # ---------- MuonHLTWeight ------------------------------------------------
  # Correctionlib-based HLT isolation scale factor.
  # Evaluated on the leading muon passing kinematic cuts.
  muonHLT:
    UL2016preVFP:
      HLTSFFile: "inputs/SFs/UL2016preVFP_mu_HLT.json"
      selMuonBranch: "SelMuon"
      correctionLib:
        weightName: "NUM_IsoMu24_or_IsoTkMu24_DEN_CutBasedIdTight_and_PFIsoTight"
      branchNames:
        sf:     "muonHLTWeight"
        sfstat: "muonHLTWeightStat"
        sfsyst: "muonHLTWeightSyst"
    UL2016postVFP:
      HLTSFFile: "inputs/SFs/UL2016postVFP_mu_HLT.json"
      selMuonBranch: "SelMuon"
      correctionLib:
        weightName: "NUM_IsoMu24_or_IsoTkMu24_DEN_CutBasedIdTight_and_PFIsoTight"
      branchNames:
        sf:     "muonHLTWeight"
        sfstat: "muonHLTWeightStat"
        sfsyst: "muonHLTWeightSyst"
    UL2017:
      HLTSFFile: "inputs/SFs/UL2017_mu_HLT.json"
      selMuonBranch: "SelMuon"
      correctionLib:
        weightName: "NUM_IsoMu27_DEN_CutBasedIdTight_and_PFIsoTight"
      branchNames:
        sf:     "muonHLTWeight"
        sfstat: "muonHLTWeightStat"
        sfsyst: "muonHLTWeightSyst"
    UL2018:
      HLTSFFile: "inputs/SFs/UL2018_mu_HLT.json"
      selMuonBranch: "SelMuon"
      correctionLib:
        weightName: "NUM_IsoMu24_DEN_CutBasedIdTight_and_PFIsoTight"
      branchNames:
        sf:     "muonHLTWeight"
        sfstat: "muonHLTWeightStat"
        sfsyst: "muonHLTWeightSyst"

  # ---------- jetPUIdWeight ------------------------------------------------
  # Per-jet PU ID scale factor for jets with 12.5 < pT <= 50 GeV.
  # efficiencyFolder: base folder; ROOT files expected at <folder>/<era>/<channel>.root
  #   Generate with: run_all.py --computeJetPUIDEfficiency (writes to inputs/SFs/JetPUID/Efficiency)
  # jetPUIdFile:    correctionlib file providing PUJetID_eff correction.
  jetPUID:
    UL2016preVFP:
      efficiencyFolder: "inputs/SFs/JetPUID/Efficiency"
      jetPUIdFile:    "inputs/SFs/UL2016preVFP_jet_jmar.json.gz"
      branchNames:
        sf:     "jetPUIdWeight"
        sfup:   "jetPUIdWeightUp"
        sfdown: "jetPUIdWeightDown"
    UL2016postVFP:
      efficiencyFolder: "inputs/SFs/JetPUID/Efficiency"
      jetPUIdFile:    "inputs/SFs/UL2016postVFP_jet_jmar.json.gz"
      branchNames:
        sf:     "jetPUIdWeight"
        sfup:   "jetPUIdWeightUp"
        sfdown: "jetPUIdWeightDown"
    UL2017:
      efficiencyFolder: "inputs/SFs/JetPUID/Efficiency"
      jetPUIdFile:    "inputs/SFs/UL2017_jet_jmar.json.gz"
      branchNames:
        sf:     "jetPUIdWeight"
        sfup:   "jetPUIdWeightUp"
        sfdown: "jetPUIdWeightDown"
    UL2018:
      efficiencyFolder: "inputs/SFs/JetPUID/Efficiency"
      jetPUIdFile:    "inputs/SFs/UL2018_jet_jmar.json.gz"
      branchNames:
        sf:     "jetPUIdWeight"
        sfup:   "jetPUIdWeightUp"
        sfdown: "jetPUIdWeightDown"

  # ---------- bTaggingWeight -----------------------------------------------
  # DeepJet medium WP b-tagging scale factor (per-jet product method).
  # efficiencyFolder: base folder; ROOT files expected at <folder>/<era>/<channel>.root
  # bTagThreshold:    DeepJet medium WP value (matches bjetCut above).
  bTagging:
    UL2016preVFP:
      era:             "UL2016preVFP"
      bTagSFFile:      "inputs/SFs/UL2016preVFP_jet_Btagging.json"
      efficiencyFolder: "inputs/SFs/Efficiency"
      bTagThreshold:   0.2598
      branchNames:
        sf:     "bTagWeight"
        sfup:   "bTagWeightUp"
        sfdown: "bTagWeightDown"
    UL2016postVFP:
      era:             "UL2016postVFP"
      bTagSFFile:      "inputs/SFs/UL2016postVFP_jet_Btagging.json"
      efficiencyFolder: "inputs/SFs/Efficiency"
      bTagThreshold:   0.2489
      branchNames:
        sf:     "bTagWeight"
        sfup:   "bTagWeightUp"
        sfdown: "bTagWeightDown"
    UL2017:
      era:             "UL2017"
      bTagSFFile:      "inputs/SFs/UL2017_jet_Btagging.json"
      efficiencyFolder: "inputs/SFs/Efficiency"
      bTagThreshold:   0.3040
      branchNames:
        sf:     "bTagWeight"
        sfup:   "bTagWeightUp"
        sfdown: "bTagWeightDown"
    UL2018:
      era:             "UL2018"
      bTagSFFile:      "inputs/SFs/UL2018_jet_Btagging.json"
      efficiencyFolder: "inputs/SFs/Efficiency"
      bTagThreshold:   0.2783
      branchNames:
        sf:     "bTagWeight"
        sfup:   "bTagWeightUp"
        sfdown: "bTagWeightDown"

  # ---------- abcdScaleFactor ------------------------------------------------
  # Not a NanoAODTools Module (no ModuleList entry, nothing runs per-event) --
  # just the branch-name lookup scripts/computeABCDScaleFactor.py needs to read
  # the muon kinematics and ABCD region tag that 003-ObjectSelectionI's
  # SelectedObjectsProducer already wrote onto every selectionII skim (passed
  # straight through unchanged by this chapter's own modules). Era-independent
  # -- these prefixes don't change per era, unlike Modules.selectedObjects[era]
  # in 003-ObjectSelectionI, which this mirrors.
  #
  # The transfer factor R = N_C/N_D itself is computed by --computeABCDScaleFactor
  # (after the SF modules above have produced selectionII skims), written to
  # outputs/{tag}/{hash}/{era}/abcdScaleFactor_{era}.root. There is no
  # per-event module/branch for it here -- 003-ObjectSelectionIII looks it up
  # live, per event, only when building region-B histograms.
  abcdScaleFactor:
    branchNames:
      muon:       "SelMuon"
      abcdRegion: "ABCD"

weightLookUp:
  lheWeightSign:
    name: "lheWeightSign"
    lo: -1.25
    hi: 1.25
    binNumbers: 25
    label: "LHE weight sign"

  # ---------- Pileup weights ------------------------------------------------
  # Not verified against real output yet -- PUWeight.py hasn't run on data
  # with Pileup_nTrueInt present. Ranges are the standard expected shape for
  # this kind of correction, not measured.
  puWeight:
    name: "puWeight"
    lo: 0.0
    hi: 3.0
    binNumbers: 30
    label: "Pileup SF (central)"
  puWeightUp:
    name: "puWeightUp"
    lo: 0.0
    hi: 3.0
    binNumbers: 30
    label: "Pileup SF (up)"
  puWeightDown:
    name: "puWeightDown"
