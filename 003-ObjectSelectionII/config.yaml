    hi: 3.0
    binNumbers: 30
    label: "Pileup SF (down)"

  # ---------- Muon ID weights ----------------------------------------------
  # Data: min=0.966, max=0.993, mean=0.989, std=0.005
  muonIDWeight:
    name: "muonIDWeight"
    lo: 0.90
    hi: 1.05
    binNumbers: 30
    label: "Muon ID SF (central)"
  muonIDWeightUp:
    name: "muonIDWeightUp"
    lo: 0.90
    hi: 1.05
    binNumbers: 30
    label: "Muon ID SF (up)"
  muonIDWeightDown:
    name: "muonIDWeightDown"
    lo: 0.90
    hi: 1.05
    binNumbers: 30
    label: "Muon ID SF (down)"

  # ---------- Muon HLT weights ---------------------------------------------
  # muonHLTWeight: min=0.959, max=1.013, mean=0.985, std=0.013
  # muonHLTWeightStat/Syst: absolute uncertainties (~0.0001-0.011), not SFs
  muonHLTWeight:
    name: "muonHLTWeight"
    lo: 0.90
    hi: 1.10
    binNumbers: 40
    label: "Muon HLT SF (central)"
  muonHLTWeightStat:
    name: "muonHLTWeightStat"
    lo: 0.0
    hi: 0.015
    binNumbers: 30
    label: "Muon HLT SF stat uncertainty"
  muonHLTWeightSyst:
    name: "muonHLTWeightSyst"
    lo: 0.0
    hi: 0.005
    binNumbers: 10
    label: "Muon HLT SF syst uncertainty"

  # ---------- Muon isolation weights ----------------------------------------
  # muonIsoWeightStat/Syst: absolute uncertainties, not SFs (same convention
  # as muonHLTWeightStat/Syst above) -- for tight-iso (<0.06) events these
  # come from the 0.06-WP ROOT file's bin errors, for loose-iso (>=0.06)
  # events from mu_ID.json's own stat/syst scale_factors nodes.
  muonIsoWeight:
    name: "muonIsoWeight"
    lo: 0.90
    hi: 1.10
    binNumbers: 40
    label: "Muon Iso SF (central)"
  muonIsoWeightStat:
    name: "muonIsoWeightStat"
    lo: 0.0
    hi: 0.01
    binNumbers: 30
    label: "Muon Iso SF stat uncertainty"
  muonIsoWeightSyst:
    name: "muonIsoWeightSyst"
    lo: 0.0
    hi: 0.02
    binNumbers: 30
    label: "Muon Iso SF syst uncertainty"

  # ---------- Jet PU ID weights --------------------------------------------
  # NOT in weightList.MC (see that block's comment) -- Method 1a is
  # inherently unstable at this WP's ~90-99% efficiency; even with a [0.1,3.0]
  # event-level clip the branch's mean sits at ~0.45 on real UL2016preVFP MC,
  # not the ~1 these ranges assume. Branch is still written (useful for
  # offline study of the instability itself), just not multiplied into any
  # nominal weight. Ranges below are the ORIGINAL "if this worked" placeholder
  # -- do not read a well-behaved plot out of this diagnostic as validation.
  jetPUIdWeight:
    name: "jetPUIdWeight"
    lo: 0.5
    hi: 1.5
    binNumbers: 50
    label: "Jet PU ID SF (central)"
  jetPUIdWeightUp:
    name: "jetPUIdWeightUp"
    lo: 0.5
    hi: 1.5
    binNumbers: 50
    label: "Jet PU ID SF (up)"
  jetPUIdWeightDown:
    name: "jetPUIdWeightDown"
    lo: 0.5
    hi: 1.5
    binNumbers: 50
    label: "Jet PU ID SF (down)"

  # ---------- b-tagging weights --------------------------------------------
  # Data: bTagWeight min=0.74, max=2.12; Up min=0.71, max=2.56; Down min=0.37, max=1.68
  bTagWeight:
    name: "bTagWeight"
    lo: 0.5
    hi: 2.5
    binNumbers: 20
    label: "b-tagging SF (central)"
  bTagWeightUp:
    name: "bTagWeightUp"
    lo: 0.5
    hi: 3.0
    binNumbers: 25
    label: "b-tagging SF (up)"
  bTagWeightDown:
    name: "bTagWeightDown"
    lo: 0.0
    hi: 2.0
    binNumbers: 20
    label: "b-tagging SF (down)"

# ---------------------------------------------------------------------------
# MC weight branches multiplied together for computeABCDScaleFactor.py's
# background subtraction (read from here, not hardcoded, so it can't drift
# out of sync with what actually gets computed). Mirrors
# 003-ObjectSelectionIII's own weightList.MC -- keep the two in sync by hand,
# same as every other cross-chapter constant in this repo (DataLumiInfo,
# NgenandXsec, golden_json_urls, ...): each chapter's config.yaml stays
# self-contained rather than reaching into another chapter's file.
weightList:
  # jetPUIdWeight deliberately excluded -- see the matching comment in
  # 003-ObjectSelectionIII/config.yaml's weightList for why (Method 1a is
  # inherently unstable at this WP's ~90-99% efficiency; clipping just trades
  # a visible blowup for a quiet ~0.45-mean bias, confirmed on real
  # UL2016preVFP MC). puWeight is included but confirmed NOT present on that
  # same sample -- currently a no-op here via the warn-and-skip fallback below.
  MC: ["muonIDWeight", "muonHLTWeight", "muonIsoWeight", "bTagWeight", "puWeight", "L1PreFiringWeight_Nom", "lheWeightSign"]

