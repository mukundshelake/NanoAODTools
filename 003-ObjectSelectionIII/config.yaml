histDetails:
  lepPt:
    bins: 50
    range: [0, 200]
    name: "pt"
    label: "Leading Muon p_{T} [GeV]"
    variable: "SelMuon_pt"
    ylimits: [0.5, 100000000]  # min, max (null = auto)
  lepEta:
    bins: 50
    range: [-2.5, 2.5]
    name: "eta"
    label: "Leading Muon #eta"
    variable: "SelMuon_eta"
    ylimits: [0.5, 100000000]
  lepPhi:
    bins: 50
    range: [-3.14, 3.14]
    name: "phi"
    label: "Leading Muon #phi"
    variable: "SelMuon_phi"
    ylimits: [0.5, 100000000]
  leadingJetPt:
    bins: 50
    range: [0, 500]
    name: "leadingJetPt"
    label: "Leading Jet p_{T} [GeV]"
    variable: "leadingJet_pt"
    ylimits: [0.5, 100000000]
  leadingJetEta:
    bins: 50
    range: [-2.5, 2.5]
    name: "leadingJetEta"
    label: "Leading Jet #eta"
    variable: "leadingJet_eta"
    ylimits: [0.5, 100000000]
  leadingJetPhi:
    bins: 50
    range: [-3.14, 3.14]
    name: "leadingJetPhi"
    label: "Leading Jet #phi"
    variable: "leadingJet_phi"
    ylimits: [0.5, 100000000]
  nJets:
    bins: 8
    range: [0, 8]
    name: "nJets"
    label: "Number of Jets"
    variable: "sel_nJet"
    ylimits: [0.5, 100000000]
  nbJets:
    bins: 6
    range: [0, 6]
    name: "nbJets"
    label: "Number of b-jets"
    variable: "sel_nbjet"
    ylimits: [0.5, 100000000]

weightList:
  MC: ["muonIDWeight", "muonHLTWeight", "bTagWeight", "L1PreFiringWeight_Nom", "lheWeightSign"]
  Data: ["L1PreFiringWeight_Nom"]

# ---------------------------------------------------------------------------
# Plot settings for rootHists.py Data/MC comparison plots.
# MC groups are drawn as a filled stack; order: 1 = bottom, N = top.
# color: ROOT color integer (see https://root.cern/doc/master/classTColor.html).
# ---------------------------------------------------------------------------
plotSettings:
  MC_mu:
    QCD:
      label: "QCD"
      color: 921      # kGray+1
      order: 1
    DrellYan:
      label: "DrellYan"
      color: 3        # kGreen
      order: 2
    WJets:
      label: "WJets"
      color: 5        # kYellow
      order: 3
    SingleTop:
      label: "SingleTop"
