# Configuration for 005-Unfolding: TUnfold-based ttbar charge asymmetry measurement.
#
# Input : BDTScore ROOT files from 004C, under {STORAGE}/BDTScore/{InputTag}/{era}/
# Output: parquet -> histograms + response matrix -> unfolded A_C, under
#         {STORAGE}/unfolding/{tag}/{config_hash}/{era}/
#
# This file is the only place binning, selection, weights and normalisation are
# defined. Before adding a constant to a script, add it here instead -- the Pgof
# cut drifting between response_matrix.py and make_histograms.py (issue #32) is
# what the old four-script layout cost.

# Same root every other chapter uses. 005 previously pointed at
# /mnt/disk1/skimmed_Run2, which holds the OLD pre-hash pipeline (tags midNov,
# lateOctober, ...). That generation's reconstruction is materially worse:
# measured dilution D = 0.213 there against 0.407 here.
STORAGE:
  cms2:      "/mnt/disk3/nfs/mukund/DataFiles"
  localhost: "/nfs/disk3/mukund/DataFiles"
  lxplus:    "/eos/user/m/mshelake/DataFiles"

# Input is 004B-BDTVariables' output. 004C has trained a model for this
# campaign but has not scored ROOT files with it, so there is no BDTScore
# branch yet -- see selection.bdt_cut below.
#   {STORAGE}/{InputStage}/{InputTag}/{InputHash}/{era}/{DataMC}/{group}/{sample}
InputStage: BDTVariables
InputTag: earlySeptember_corrected
InputHash: 1022d663f7d9

# UL2016preVFP only, by decision. The other eras are incomplete: postVFP stops
# at 004A, UL2017's 004A was built on the UNCORRECTED 003 chain, UL2018 has no
# 004A at all.
Eras: [UL2016preVFP]

# ---------------------------------------------------------------------------
# Samples. Signal is the sample the response matrix is built from; Backgrounds
# are subtracted from the measured spectrum; Data is the measured spectrum.
# ---------------------------------------------------------------------------
Signal: ttbar_SemiLeptonic

# These match 004B-BDTVariables/config.yaml exactly. (The _HIPM_ names and
# Run2016B_ver1_mu that a note here previously warned about were a midNov
# artifact; this campaign is consistent with the config.)
DataGroup: SingleMuon
Data:
  - Run2016B_ver2_mu
  - Run2016C_mu
  - Run2016D_mu
  - Run2016E_mu
  - Run2016F_mu

# ---------------------------------------------------------------------------
# Binning. Consumed by scripts/binning.py, which is the single implementation
# of the N+/N- classification and the unrolling.
#
# scheme: "sign"      delta|y| = |y_t| - |y_tbar|;  N+ = delta|y| > 0
#                     Every event is classified. This is what theory
#                     predictions are quoted against.
#         "threshold" N+ = |y_t| > y0 AND |y_tbar| < y0 (and vice versa).
#                     Discards ~73% of reco events as "neither" (issue #34).
#
# Edges must lie on binning.FINE_MTT_EDGES (25 GeV grid) and y0 on
# binning.FINE_Y_EDGES (0.1 grid), so that the gen-acceptance scan can be
# projected onto them exactly; binning.check_edges_representable() enforces it.
# ---------------------------------------------------------------------------
binning:
  scheme: sign
  y0: 1.2
  gen_mtt_edges:  [300, 450, 600, 750, 900, 1050, 1200]
  reco_mtt_edges: [300, 375, 450, 525, 600, 675, 750, 825, 900, 975, 1050, 1125, 1200]

# ---------------------------------------------------------------------------
# Reco selection. Applied identically to the response matrix, the measured
# histogram, every background and every systematic variation, by
# scripts/selection.py. There is no second place to change it.
# ---------------------------------------------------------------------------
selection:
  # Pgof = exp(-0.5*chi2) from 004A RecoModule, so it is never mathematically
  # zero -- values of 0.0 are float32 underflow at chi2 >~ 180, i.e. genuinely
  # catastrophic fits. This is "reject hopeless fits", not a p-value cut; the
  # branch name is a misnomer (it is a likelihood ratio, not a probability).
  pgof_min: 0.0

  # 004A writes chi2_status from the soft-constraint fit. Status 3 events fall
  # back to the unfitted momenta and are written as if successful, so they are
  # rejected here rather than silently degrading the resolution (issue #42).
  reject_chi2_status: [3]

  # Physical sanity window. The soft-constraint fit is unbounded and reaches
  # m_tt = 101,632 GeV in the signal parquet; |y| > 5 is not a top. Events
  # outside are counted and reported, never dropped silently (issue #42).
  mtt_reco_max: 3000.0
  abs_y_max: 5.0

  # ABCD region. 0 = A = the nominal signal region (tight isolation, high
  # mT(W)); 1 = B (loose iso, high mTW), 2 = C, 3 = D. The 002 preselection
  # keeps iso <= 0.2 while the ABCD split is at 0.06, so the skim contains all
  # four regions and 005 must pick one. Without this cut only ~56% of ttbar and
  # ~48% of data events belong in the measurement, and essentially all of the
  # QCD contamination is included (issue #37). null = no region cut.
  abcd_region: 0

  # BDT score cut. null = no cut, which is also the only option today: 004C has
  # trained a model for this campaign (AUC 0.7013) but no stage has scored ROOT
  # files, so there is no BDTScore branch to cut on. extract.py treats it as
  # optional and records whether it was found.
  bdt_cut: null

# ---------------------------------------------------------------------------
# Event weights.
#
# L1PreFiringWeight_Nom corrects simulation for a trigger inefficiency that
# real data already contains intrinsically, so it must NEVER appear in the Data
# list. Same rule as 004B's weightList and 003-III's config.
# ---------------------------------------------------------------------------
# Branch names in this campaign are lowercase-initial (lheWeightSign,
# muonIDWeight, bTagWeight, ...). The old midNov pipeline used capitalised
# names; do not mix them.
#
# L1PreFiringWeight_Nom corrects simulation for a trigger inefficiency that real
# data already contains intrinsically, so it must NEVER appear in the Data list.
# It *is* present in the Data_mu trees, so the empty list below is load-bearing
# and is enforced by assertion in extract.py.
#
# topPtWeight is available and deliberately NOT applied: it is a modelling
# reweighting of the ttbar spectrum, which belongs in the systematics rather
# than the nominal weight.
weights:
  MC:
    - lheWeightSign
    - puWeight
    - bTagWeight
    - muonIDWeight
    - muonIsoWeight
    - muonHLTWeight
    - L1PreFiringWeight_Nom
  Data: []

# Two forms of variation:
#   up/down   the branch holds a fully varied weight (replaces the nominal)
#   absolute  the branch holds an absolute uncertainty on the nominal, so the
#             variation is nominal +- that value. muonHLT and muonIso ship
#             their stat and syst components this way (mean ~0.0007, i.e.
#             ~0.07%), NOT as varied weights -- which is how the "MuonHLTWeight
#             has no up/down variation" gap in #43 gets closed.
systematics:
  pileup:      {nominal: puWeight,              up: puWeightUp,        down: puWeightDown}
  btag:        {nominal: bTagWeight,            up: bTagWeightUp,      down: bTagWeightDown}
  muonID:      {nominal: muonIDWeight,          up: muonIDWeightUp,    down: muonIDWeightDown}
  prefiring:   {nominal: L1PreFiringWeight_Nom, up: L1PreFiringWeight_Up, down: L1PreFiringWeight_Dn}
  muonHLTStat: {nominal: muonHLTWeight,         absolute: muonHLTWeightStat}
  muonHLTSyst: {nominal: muonHLTWeight,         absolute: muonHLTWeightSyst}
  muonIsoStat: {nominal: muonIsoWeight,         absolute: muonIsoWeightStat}
  muonIsoSyst: {nominal: muonIsoWeight,         absolute: muonIsoWeightSyst}

# ---------------------------------------------------------------------------
# QCD estimate.
#
# The QCD MC is tiny and unreliable in this selection (a few hundred events
# across the whole spectrum). 003-ObjectSelectionII computes a data-driven
# transfer factor R = N_qcd_C / N_qcd_D binned in (SelMuon_pt, |SelMuon_eta|),
# and the QCD estimate in region A is
#
#     N_qcd_A(x) = R * [ data_B(x) - non-QCD MC_B(x) ]
#
# taken per event from region B, which shares region A's high-mT(W) requirement
# and so has the right shape (see 003-III's README).
#
# Note this campaign's R has a zero bin at pT > 50, |eta| < 1.2 -- the region-D
# yield there was floored at zero -- so the QCD estimate vanishes for those
# events rather than being extrapolated.
qcd:
  # "data" uses the transfer-factor template; "mc" uses the QCD MC group.
  source: data
  # Relative to the repo root. preVFP's 003-II output is under the TYPO tag.
  transfer_factor: "003-ObjectSelectionII/outputs/earlySepetember_correted/37f710b13012/{era}/abcdScaleFactor_{era}.root"
  transfer_factor_hist: ABCD_transferFactor_R
  # Fractional normalisation uncertainty on the QCD estimate, passed to
  # SubtractBackground. The transfer factor is statistically limited, so this
  # is not a token number -- revisit against the report JSON.
  uncertainty: 0.30

# Fractional normalisation uncertainty on each non-QCD MC background group,
# passed to TUnfoldSys::SubtractBackground so it propagates into the unfolded
# covariance rather than being ignored.
background_uncertainty:
  default: 0.10
  SemiLeptonic: 0.05
  FullyLeptonic: 0.05
  SingleTop: 0.10
  WJets: 0.20
  DrellYan: 0.20
  Diboson: 0.20

# ---------------------------------------------------------------------------
# Normalisation.
#
# lumi_scale = Xsec * Lumi / Ngen.
#
# Ngen is the sum of SIGNED generator weights, NOT the raw generated count --
# verified from the Runs trees of the UL2016preVFP ttbar_SemiLeptonic skim:
#   sum genEventCount = 132,178,000   (raw)
#   sum genEventSumw  = 39,772,305,735.1
#   |genWeight|       = 303.358 exactly (constant for this powheg sample)
#   sum genEventSumw / |genWeight| = 131,106,830  ==  the Ngen below.
# This matters because LHEWeightSign is applied as an event weight, so the
# denominator must be the corresponding sum of signed weights (issue #41). The
# "--ngen 110787582" in the old script docstrings was simply wrong.
#
# Values below are copied from 004B-BDTVariables/config.yaml and pinned against
# it by scripts/test_config.py, so the two cannot drift.
# ---------------------------------------------------------------------------
DataLumiInfo:
  UL2016preVFP: {Lumi: 19521.2, LumiUnc: 0.012}

