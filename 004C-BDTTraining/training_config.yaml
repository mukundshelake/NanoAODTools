# Configuration for the BDT training step of 004C-BDTTraining: trains an
# XGBoost classifier per era to distinguish qqbar-initiated (y==1) from
# every other initial state (non-qqbar) in ttbar_SemiLeptonic production.
#
# Hashed independently of config.yaml (see utils.compute_config_hash) so that
# tuning the grid search or feature-selection settings never forces parquet
# re-extraction. The resulting training_hash versions
# outputs/{tag}/{parquetHash}/{era}/bdt/{training_hash}/.

# Which extraction-side dataset to train on. Must match a
# DataMC/group/dataset key present in Parquet_{tag}_{era}_datasets.json.
# Nominal ttbar_SemiLeptonic only -- deliberately excludes the MC_alt
# generator-tune systematic variants (ttbar_SemiLeptonic_Gluonmove,
# _QCDinspired, _TuneCP5up/down, _erdON).
TrainingSample:
  DataMC:  MC_mu
  group:   SemiLeptonic
  dataset: ttbar_SemiLeptonic

# Feature columns used for training -- a subset of config.yaml's
# BDTVariables + AdditionalFeatures, decoupled here so future runs can try
# feature subsets without touching (and re-hashing) the extraction config.
Features:
  - JetHT
  - pTSum
  - FW1
  - FW2
  - FW3
  - AL
  - Sxx
  - Syy
  - Sxy
  - Sxz
  - Syz
  - Szz
  - S
  - P
  - A
  - p2in
  - p2out
  - sel_nJet
  - sel_nbjet

# Listed explicitly so trainBDT.py doesn't have to infer dtype from the
# parquet schema, and so these get median (not mean) imputation.
IntegerFeatures:
  - sel_nJet
  - sel_nbjet

# Training-label source branch.
TargetBranch: y

# Keep only events with y in these keys, then map to the given binary class.
# The measurement wants qqbar-initiated vs everything-else, so qqbar is the
# SIGNAL (class 1) and every other hard-scattering initial state is
# background (class 0). With qqbar as the positive class the model's
# predict_proba[:, 1] reads directly as P(qqbar), which is the quantity
# downstream chapters want -- no 1-minus-score convention to remember.
#
# An earlier version of this file kept only y in {1, 2} and trained strictly
# qqbar-vs-gg, dropping qg entirely. On UL2016preVFP that silently discarded
# 1,727,978 of 6,884,570 ttbar_SemiLeptonic events (25.1%, all y==3) -- and
# those events still exist at inference time, so the classifier was being
# applied to a population it had never been shown. y==4/5 do not occur in
# this sample (both exactly 0) but are mapped anyway so the scheme stays
# correct if a future sample produces them.
#
# y==0 (undefined / Data) is deliberately absent: it is not a physics
# category, and dropping it here is what keeps Data out of training.
Labels:
  1: 1   # qqbar          -> signal
  2: 0   # gg             -> background
  3: 0   # qg             -> background
  4: 0   # qq' diff flav  -> background
  5: 0   # qq  same flav  -> background

# "scale_pos_weight": keep all rows, weight the loss instead (XGBoost-native).
# Computed from the TRAIN split only, after the split, to avoid leaking the
# held-out class balance into a training-time hyperparameter.
# "downsample": randomly subsample the majority class to the minority class
# size (what the old script did).
#
# Default is scale_pos_weight because downsampling is expensive here: qqbar
# is ~5.6% of the sample, so balancing qqbar against all non-qqbar by
# downsampling keeps only ~2/18 of the events and throws away over a million
# real background events per era for nothing.
ClassBalancing:
  method: scale_pos_weight
  random_state: 42

# Three-way split: train / validation / test.
#   train      -- preprocessor fit, GridSearchCV (which cross-validates
#                 internally on this split alone)
#   validation -- permutation importance, and therefore feature selection
#   test       -- final AUC, ROC, confusion matrix, overtraining check
# val_size is a fraction of the post-test remainder, so the defaults below
# give a 0.56 / 0.14 / 0.30 split of the full sample. Feature selection used
# to rank features on the test set and then report the reduced model's AUC on
# that same test set, which biased the full-vs-reduced comparison in the
# reduced model's favour; the validation split exists to keep test untouched
# until the final evaluation.
Split:
  test_size: 0.3
  val_size: 0.2
  random_state: 42
  stratify: true

# XGBClassifier constructor args applied at every grid point.
FixedParams:
  objective: binary:logistic
  eval_metric: auc
  random_state: 42
  n_jobs: -1
  tree_method: hist

# GridSearchCV parameter grid. Kept modest deliberately: 3x3x3x2x2 = 108
# grid points * cv=3 = 324 fits/era. XGBoost's hist tree method makes this
# comparable in wall-clock cost to the old script's 27-point grid over the
# markedly slower sklearn GradientBoostingClassifier.
ParamGrid:
  n_estimators:     [100, 300, 500]
  max_depth:        [3, 4, 5]
  learning_rate:    [0.01, 0.05, 0.1]
  subsample:        [0.8, 1.0]
  colsample_bytree: [0.8, 1.0]

# Fixed rather than grid-searched, to keep combinatorics tractable -- the
# old script never tuned regularization either, and 19 features on a
# few-hundred-thousand-event balanced sample is a low overfitting-risk
# regime. Still hand-tunable here without touching code.
RegularizationParams:
  reg_lambda: 1.0
  min_child_weight: 1
  gamma: 0.0

# subsample_rows: cap the rows the SEARCH sees. The winning parameters are
# then refit on the entire train split, so the final model still uses every
# event -- only the 108 x cv ranking fits are cheap. Which hyperparameters
# rank best is stable far below full statistics; the final fit is what
# actually benefits from them.
#
# This exists because ClassBalancing defaults to scale_pos_weight: the train
# split is the whole sample (3.86M rows on UL2016preVFP), not a balanced
# ~430k downsample, so without a cap this grid costs ~9x what its size was
# chosen for. Set to null to search on the full train split.
GridSearch:
  cv: 3
  scoring: roc_auc
  n_jobs: -1
  verbose: 2
  subsample_rows: 500000
  subsample_random_state: 42

# Train-vs-test overtraining check. A verdict of "overtraining suspected"
# needs BOTH criteria: the Kolmogorov-Smirnov p-value below
# p_value_threshold AND the KS statistic itself at or above
# ks_statistic_threshold.
#
# The statistic gate is the one that matters here. KS p-values collapse
# toward zero as samples grow, so on a full era (214k train / 115k test
# signal events) a p-only test flags differences far too small to care
# about: UL2016preVFP's signal class scored KS = 0.0071 at p = 0.001 --
# the statistic had dropped 27x from the 20k-event smoke test's 0.1934,
# meaning overtraining had essentially gone, yet a bare p < 0.01 gate still
# printed "overtraining suspected". 0.05 is roughly where a shift between
# two score distributions becomes visible by eye on the overlay plot.
OvertrainingCheck:
  ks_statistic_threshold: 0.05
  p_value_threshold: 0.01

# Importance-based feature slimming: rank by built-in (gain) importance and
# permutation importance on the held-out VALIDATION split, then retrain on
# the top-N features and compare AUC before/after on the test split, which
# neither model's feature set was chosen with. Set select_features to null
# (or remove the key) to skip this step entirely.
FeatureSelection:
  select_features: 10
  permutation_importance:
    n_repeats: 10
    random_state: 42
    scoring: roc_auc
  performance_drop_threshold: 0.01
