# PyTorch models for Appendix-B (scripts/train_torch.py), run in the `torchml` conda env
# (CPU torch 2.14). Hashed separately; outputs go to
# outputs/{tag}/{configHash}/{era}/training_torch/{torchHash}/.
# Same split and evaluation as training_config.yaml, so AUCs compare directly with XGBoost.

TorchPython: /home/mukund/miniconda3/envs/torchml/bin/python
# 10 = physical cores; 20 (hyper-threads) oversubscribes and runs 10-50x slower.
threads: 10

Split:
  test:  [0, 1, 2]
  val:   [3]
  train: [4, 5, 6, 7, 8, 9]

# null = all 9.1M train events.
max_train_rows: null

# Objects: muon, neutrino, then up to 10 jets (config.yaml ObjectArrays).
NObjects: 12

# Flat event-level features fed to every model (same as training_config.yaml 'reco').
FlatFeatures:
  - n_jets
  - n_bjets
  - mu_pt
  - mu_abseta
  - met_pt
  - nu_complex
  - nu_abspz
  - ht
  - centrality
  - sys_m
  - sys_pt
  - sys_absy
  - sys_abspz
  - sys_xmax
  - sys_xmin
  - sphericity
  - aplanarity
  - log_chi2
  - m_thad
  - m_tlep
  - m_whad
  - tt_m
  - tt_pt
  - tt_absy
  - tt_abspz
  - tt_xmax
  - tt_xmin
  - top_absy_max
  - top_absy_min
  - top_absdy
  - top_pt_max
  - top_pt_min
  - abs_cos_theta_star
  - cos_phi_ld
  - c_kk
  - extra_ht
  - extra1_pt
  - extra1_abseta
  - jet0_pt
  - jet0_abseta
  - jet0_btag
  - jet1_pt
  - jet1_abseta
  - jet1_btag
  - jet2_pt
  - jet2_abseta
  - jet2_btag
  - jet3_pt
  - jet3_abseta
  - jet3_btag
  - jet4_pt
  - jet4_abseta
  - jet4_btag
  - jet5_pt
  - jet5_abseta
  - jet5_btag

Training:
  epochs: 20
  batch_size: 4096
  lr: 2.0e-3
  weight_decay: 1.0e-4
  patience: 3

Models:
  mlp:
    hidden: [256, 256, 128, 64]
    dropout: 0.1
  deepsets:
    phi: [64, 128, 128]
    rho: [256, 128, 64]
    dropout: 0.1
    use_flat: true
  part:
    dim: 64
    heads: 4
    ff: 128
    layers: 3
    cls_layers: 2
    head: [128, 64]
    dropout: 0.1
    pair_features: true
    use_flat: true

# qgl: add Jet_qgl to the per-jet inputs (data-modelling caveat as in training_config.yaml).
# max_train_rows (per run): ParT runs at ~6k events/s on 10 CPU threads (~25 min per full
# 9.1M epoch), so they train on a fixed 3M-event subsample of the train split.
Runs:
  - {name: torch_mlp,        model: mlp}
  - {name: deepsets,         model: deepsets}
  - {name: part,             model: part, max_train_rows: 3000000}
  - {name: part_qgl,         model: part, qgl: true, max_train_rows: 3000000}
  - {name: part_objonly,     model: part, override: {use_flat: false}, max_train_rows: 3000000}

Evaluation:
  keep_fractions: [1.0, 0.5, 0.3, 0.2, 0.1, 0.05, 0.02]
  mtt_bins: [300, 450, 600, 800, 1000, 1500]
