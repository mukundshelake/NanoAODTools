# A_C-sensitivity study (scripts/asym/): learn per-event E[true sign of Delta|y| | reco]
# (T1) and E[true sign x 1(qqbar) | reco] (T2) with a 4-class model (qqbar/other x s'=+/-),
# s' = muCharge * sign(Delta|y|_true). Inputs are charge-blind; the signed observable is
# muCharge * h'. Hashed separately -> outputs/{tag}/{hash}/{era}/asym/{asymHash}/.

Split:
  test:  [0, 1, 2]
  val:   [3]
  train: [4, 5, 6, 7, 8, 9]

# Charge-blind, z-flip-invariant inputs (Delta|y| is invariant under z -> -z).
SymmetricFeatures:
  - n_jets
  - n_bjets
  - mu_pt
  - mu_abseta
  - met_pt
  - nu_complex
  - nu_abspz
  - ht
  - centrality
  - sys_m
  - sys_pt
  - sys_absy
  - sys_abspz
  - sys_xmax
  - sys_xmin
  - sphericity
  - aplanarity
  - log_chi2
  - m_thad
  - m_tlep
  - m_whad
  - tt_m
  - tt_pt
  - tt_absy
  - tt_abspz
  - tt_xmax
  - tt_xmin
  - top_absy_max
  - top_absy_min
  - top_absdy
  - top_pt_max
  - top_pt_min
  - abs_cos_theta_star
  - cos_phi_ld
  - c_kk
  - extra_ht
  - extra1_pt
  - extra1_abseta
  - jet0_pt
  - jet0_abseta
  - jet0_btag
  - jet1_pt
  - jet1_abseta
  - jet1_btag
  - jet2_pt
  - jet2_abseta
  - jet2_btag
  - jet3_pt
  - jet3_abseta
  - jet3_btag
  - jet4_pt
  - jet4_abseta
  - jet4_btag
  - jet5_pt
  - jet5_abseta
  - jet5_btag
# Lepton-side vs hadron-side information (asymmetric between the two tops, still charge-blind).
AsymFeatures:
  - rec_absy_tlep
  - rec_absy_thad
  - rec_dabsy_lh
  - rec_dabsy_lh_bswap
  - rec_dabsy_lh_nu2
  - rec_log_chi2_bswap
  - rec_tlep_pt
  - rec_thad_pt
  - rec_absy_mu
  - rec_absy_blep
  - rec_absy_bhad
  - rec_absy_whad
  - rec_absy_nu
  - rec_dabsy_b
  - rec_nu_dpz
# Added automatically when present (preVFP from 004A output).
OptionalFeatures:
  - kf_dabsy_lh

XGB:
  n_estimators: 3000
  early_stopping_rounds: 30
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 10
  tree_method: hist
  n_jobs: 20
  random_state: 42

# 005-Unfolding reco m_tt edges (config.yaml binning.reco_mtt_edges) + under/overflow.
RecoMttEdges: [300, 375, 450, 525, 600, 675, 750, 825, 900, 975, 1050, 1125, 1200]
MLBins: 100
FineDabsyBins: 40
Bootstrap: 20

# Optional: qqbar classifier scores (test_scores.parquet of a train_torch/train run) for the
# '005 x qqbar-score quartile' baseline. Column used: QQScoreColumn.
QQScoreColumn: score_deepsets

# DeepSets version (scripts/asym/asym_torch.py, torchml env). Same split/evaluation.
Torch:
  TorchPython: /home/mukund/miniconda3/envs/torchml/bin/python
  threads: 10
  NObjects: 12
  epochs: 20
  batch_size: 4096
  lr: 2.0e-3
  weight_decay: 1.0e-4
  patience: 3
  model:
    phi: [64, 128, 128]
    rho: [256, 128, 64]
    dropout: 0.1
    use_flat: true
