Pre-SelectionCuts:
  "UL2016preVFP":
        muonCut: "Sum$(Muon_pt > 26 && abs(Muon_eta) < 2.4 && Muon_tightId && Muon_pfRelIso04_all <= 0.2) >= 1"
        bjetCut: "Sum$(Jet_pt > 25 && abs(Jet_eta) < 2.4 && Jet_btagDeepFlavB > 0.2598 && Jet_jetId == 6 && (Jet_pt > 50 | Jet_puId > 0)) >= 2"
        jetCut: "Sum$(Jet_pt > 25 && abs(Jet_eta) < 2.4 && Jet_jetId == 6 && (Jet_pt > 50 | Jet_puId > 0)) >= 4"
        HLTCut: "(HLT_IsoMu24 || HLT_IsoTkMu24)"
        METFlags: "Flag_goodVertices && Flag_globalSuperTightHalo2016Filter && Flag_HBHENoiseFilter && Flag_HBHENoiseIsoFilter && Flag_EcalDeadCellTriggerPrimitiveFilter && Flag_BadPFMuonFilter && Flag_BadPFMuonDzFilter && Flag_eeBadScFilter"
  "UL2016postVFP":
        muonCut: "Sum$(Muon_pt > 26 && abs(Muon_eta) < 2.4 && Muon_tightId && Muon_pfRelIso04_all <= 0.2) >= 1"
        bjetCut: "Sum$(Jet_pt > 25 && abs(Jet_eta) < 2.4 && Jet_btagDeepFlavB > 0.2489 && Jet_jetId == 6 && (Jet_pt > 50 | Jet_puId > 0)) >= 2"
        jetCut: "Sum$(Jet_pt > 25 && abs(Jet_eta) < 2.4 && Jet_jetId == 6 && (Jet_pt > 50 | Jet_puId > 0)) >= 4"
        HLTCut: "(HLT_IsoMu24 || HLT_IsoTkMu24)"
        METFlags: "Flag_goodVertices && Flag_globalSuperTightHalo2016Filter && Flag_HBHENoiseFilter && Flag_HBHENoiseIsoFilter && Flag_EcalDeadCellTriggerPrimitiveFilter && Flag_BadPFMuonFilter && Flag_BadPFMuonDzFilter && Flag_eeBadScFilter"
  "UL2017":
        muonCut: "Sum$(Muon_pt > 29 && abs(Muon_eta) < 2.4 && Muon_tightId && Muon_pfRelIso04_all <=  0.2) >= 1"
        bjetCut: "Sum$(Jet_pt > 25 && abs(Jet_eta) < 2.4 && Jet_btagDeepFlavB > 0.3040 && Jet_jetId == 6 && (Jet_pt > 50 | Jet_puId > 0)) >= 2"
        jetCut: "Sum$(Jet_pt > 25 && abs(Jet_eta) < 2.4 && Jet_jetId == 6 && (Jet_pt > 50 | Jet_puId > 0)) >= 4"
        HLTCut: "HLT_IsoMu27"
        METFlags: "Flag_goodVertices && Flag_globalSuperTightHalo2016Filter && Flag_HBHENoiseFilter && Flag_HBHENoiseIsoFilter && Flag_EcalDeadCellTriggerPrimitiveFilter && Flag_BadPFMuonFilter && Flag_BadPFMuonDzFilter && Flag_eeBadScFilter"
  "UL2018":
        muonCut: "Sum$(Muon_pt > 27 && abs(Muon_eta) < 2.4 && Muon_tightId && Muon_pfRelIso04_all <= 0.2) >= 1"
        bjetCut: "Sum$(Jet_pt > 25 && abs(Jet_eta) < 2.4 && Jet_btagDeepFlavB > 0.2783 && Jet_jetId == 6 && (Jet_pt > 50 | Jet_puId > 0)) >= 2"
        jetCut: "Sum$(Jet_pt > 25 && abs(Jet_eta) < 2.4 && Jet_jetId == 6 && (Jet_pt > 50 | Jet_puId > 0)) >= 4"
        HLTCut: "HLT_IsoMu24"
        METFlags: "Flag_goodVertices && Flag_globalSuperTightHalo2016Filter && Flag_HBHENoiseFilter && Flag_HBHENoiseIsoFilter && Flag_EcalDeadCellTriggerPrimitiveFilter && Flag_BadPFMuonFilter && Flag_BadPFMuonDzFilter && Flag_eeBadScFilter"

# Branch selection for NanoAOD skimming (used to generate keep_and_drop.txt on the worker node)
# Format: first "drop *" drops everything, then each "keep" entry is written in order.
branch_selection:
  drop:
    - "*"
  keep:
    - run
    - event
    - luminosityBlock
    - nJet
    - Jet_area
    - Jet_btagDeepFlavB
    - Jet_eta
    - Jet_mass
    - Jet_phi
    - Jet_pt
    - Jet_rawFactor
    - Jet_hadronFlavour
    - Jet_partonFlavour
    - Jet_jetId
    - Jet_puId
    - Jet_genJetIdx
    - L1PreFiringWeight_Nom
    - L1PreFiringWeight_Up
    - L1PreFiringWeight_Dn
    - MET_pt
    - MET_phi
    - RawMET_pt
    - RawMET_phi
    - "Flag*"
    - "GenPart*"
    - Generator_x1
    - Generator_x2
    - Generator_weight
    - Generator_xpdf1
    - Generator_xpdf2
    - Generator_id1
    - Generator_id2
    - "HLT*"
    - nMuon
    - Muon_eta
    - Muon_mass
    - Muon_phi
    - Muon_pt
    - Muon_charge
    - Muon_tightId
    - Muon_isGlobal
    - Muon_isTracker
    - Muon_looseId
    - Muon_mediumId
    - Muon_pfRelIso04_all
    - "puWeight*"
    - LHEWeight_originalXWGTUP
    - PSWeight
    - LHEScaleWeight
    - LHEPdfWeight
