# Sample configuration for NanoAODTools
# This file contains the configuration for the samples to be used in the analysis.

# Storage Base
LFN_Base : '/store/user/mshelake/DataFiles'

# Local-disk storage root, keyed by machine (matched as a substring of the
# hostname). Used by --generatePreselectionDatasetJSON to scan for CRAB
# output ROOT files once they've been copied down from EOS.
STORAGE:
  cms2:      "/mnt/disk3/nfs/mukund/DataFiles"
  localhost: "/nfs/disk3/mukund/DataFiles"
  lxplus:    "/eos/user/m/mshelake/DataFiles/"


# B-Tag thresholds
btag_threshold:
  UL2016preVFP: &btag_UL2016preVFP 0.2598
  UL2016postVFP: &btag_UL2016postVFP 0.2489
  UL2017: &btag_UL2017 0.3040
  UL2018: &btag_UL2018 0.2783

