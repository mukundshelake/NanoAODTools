        bjetCut: "Sum$(Jet_pt > 25 && abs(Jet_eta) < 2.4 && Jet_btagDeepFlavB > 0.3040 && Jet_jetId == 6 && (Jet_pt > 50 | Jet_puId > 0)) >= 2"
        jetCut: "Sum$(Jet_pt > 25 && abs(Jet_eta) < 2.4 && Jet_jetId == 6 && (Jet_pt > 50 | Jet_puId > 0)) >= 4"
        HLTCut: "HLT_IsoMu27"
        METFlags: "Flag_goodVertices && Flag_globalSuperTightHalo2016Filter && Flag_HBHENoiseFilter && Flag_HBHENoiseIsoFilter && Flag_EcalDeadCellTriggerPrimitiveFilter && Flag_BadPFMuonFilter && Flag_BadPFMuonDzFilter && Flag_eeBadScFilter"
  "UL2018":
        muonCut: "Sum$(Muon_pt > 27 && abs(Muon_eta) < 2.4 && Muon_tightId && Muon_pfRelIso04_all <= 0.2) >= 1"
        bjetCut: "Sum$(Jet_pt > 25 && abs(Jet_eta) < 2.4 && Jet_btagDeepFlavB > 0.2783 && Jet_jetId == 6 && (Jet_pt > 50 | Jet_puId > 0)) >= 2"
        jetCut: "Sum$(Jet_pt > 25 && abs(Jet_eta) < 2.4 && Jet_jetId == 6 && (Jet_pt > 50 | Jet_puId > 0)) >= 4"
        HLTCut: "HLT_IsoMu24"
        METFlags: "Flag_goodVertices && Flag_globalSuperTightHalo2016Filter && Flag_HBHENoiseFilter && Flag_HBHENoiseIsoFilter && Flag_EcalDeadCellTriggerPrimitiveFilter && Flag_BadPFMuonFilter && Flag_BadPFMuonDzFilter && Flag_eeBadScFilter"

# Branch selection for NanoAOD skimming (used to generate keep_and_drop.txt on the worker node)
# Format: first "drop *" drops everything, then each "keep" entry is written in order.
branch_selection:
  drop:
    - "*"
  keep:
    - run
    - event
    - luminosityBlock
    - nJet
    - Jet_area
    - Jet_btagDeepFlavB
    - Jet_eta
    - Jet_mass
    - Jet_phi
    - Jet_pt
    - Jet_rawFactor
    - Jet_hadronFlavour
    - Jet_partonFlavour
    - Jet_jetId
    - Jet_puId
    - Jet_genJetIdx
    # GenJet_*: Jet_genJetIdx above is an index into this collection -- kept
    # without it, that index points at nothing on the skim. Needed for JER
    # smearing / systematic variations (not implemented yet, but this is the
    # ingredient that would otherwise force a second 002-Samples reprocessing
    # to add later).
    - GenJet_pt
    - GenJet_eta
    - GenJet_phi
    - GenJet_mass
    # fixedGridRhoFastjetAll: pileup rho, standard input to JEC/JER formulas
    # and the stochastic-smearing JER fallback when no GenJet match exists.
    - fixedGridRhoFastjetAll
    - L1PreFiringWeight_Nom
    - L1PreFiringWeight_Up
    - L1PreFiringWeight_Dn
    - MET_pt
    - MET_phi
    - RawMET_pt
    - RawMET_phi
    - "Flag*"
    # PV_npvs/PV_npvsGood: standard input to the MET xy-shift (pileup/PV-position
    # modulation) correction -- not implemented yet, same rationale as GenJet_*
    # above (cheap to keep now, expensive -- a full reprocessing -- to add later).
    - PV_npvs
    - PV_npvsGood
    - "GenPart*"
    - Generator_x1
    - Generator_x2
    - Generator_weight
    - Generator_xpdf1
    - Generator_xpdf2
    - Generator_id1
    - Generator_id2
    - "HLT*"
    - nMuon
    - Muon_eta
    - Muon_mass
    - Muon_phi
    - Muon_pt
    - Muon_charge
    - Muon_tightId
    - Muon_isGlobal
    - Muon_isTracker
    - Muon_looseId
    - Muon_mediumId
    - Muon_pfRelIso04_all
    - "puWeight*"
    # Pileup_nTrueInt: MC-truth ingredient to compute PU reweighting downstream
    # (003-ObjectSelectionII's PUWeight module) via the LUM POG's puWeights.json.gz --
    # added after confirming directly (uproot, real UL2016preVFP ttbar file) that
    # this campaign's central NanoAOD has no baked-in puWeight branch (the
    # "puWeight*" keep above never matches anything), and that Pileup_nTrueInt
    # itself was being silently dropped here, before 003-ObjectSelectionI/II ever
    # saw it. Needs a 002-Samples reprocessing run to actually take effect --
    # this only fixes the branch selection for datasets processed after this change.
    - Pileup_nTrueInt
    - LHEWeight_originalXWGTUP
    - PSWeight
    - LHEScaleWeight
    - LHEPdfWeight
    # Electron_*: previously entirely absent from the skim. Added to support an
    # additional-lepton veto (event contains a loose electron beyond the signal
    # muon) -- needed to reject ttbar-dileptonic and Z/diboson contamination in
    # the semileptonic selection. deltaEtaSC is for the ECAL barrel/endcap gap
    # cut; convVeto/dxy/dz for non-prompt/conversion rejection. All names/types
    # verified live against a real Data (Run2016F SingleMuon) and MC (UL2016preVFP
    # Tchannel) file in this campaign.
    - nElectron
    - Electron_pt
    - Electron_eta
    - Electron_phi
    - Electron_mass
    - Electron_charge
    - Electron_deltaEtaSC
    - Electron_mvaFall17V2Iso_WP90
    - Electron_pfRelIso03_all
    - Electron_convVeto
    - Electron_dxy
    - Electron_dz
    # Muon_*: additions for the same veto (a rigorous loose-muon veto definition,
    # matching the electron side) plus genPartIdx/genPartFlav for MC truth-matched
    # efficiency and non-prompt-lepton studies.
    - Muon_dxy
    - Muon_dz
    - Muon_sip3d
    - Muon_genPartIdx
    - Muon_genPartFlav
    - Muon_jetIdx
    - Muon_miniPFRelIso_all
    # Jet_*: quark-gluon likelihood and c-tagging discriminants are candidate
    # features for the jet-assignment BDT (004A-Reconstruction/004B-BDT) --
    # distinguishing the two light jets from W->qq' against b-jets and ISR/FSR
    # gluon jets. Energy-fraction/constituent variables are common BDT inputs
    # and useful jet-ID cross-checks beyond the baseline Jet_jetId flag.
    # electronIdx/muonIdx complete the lepton-jet cross-cleaning pair (Muon_jetIdx
    # above is the lepton-side half).
    - Jet_qgl
    - Jet_btagDeepFlavCvL
    - Jet_btagDeepFlavCvB
    - Jet_muEF
    - Jet_chEmEF
    - Jet_neEmEF
    - Jet_chHEF
    - Jet_neHEF
    - Jet_nConstituents
    - Jet_electronIdx1
    - Jet_electronIdx2
    - Jet_muonIdx1
    - Jet_muonIdx2
    # MET_significance/cov*: MET covariance matrix, standard input to
    # likelihood/kinematic-fit neutrino-pz reconstruction (004A-Reconstruction).
    # PuppiMET: pileup-robust MET alternative to PF MET, kept alongside it so the
    # choice can be made/compared at analysis time rather than re-skimming for it.
    - MET_significance
    - MET_covXX
    - MET_covXY
    - MET_covYY
    - PuppiMET_pt
    - PuppiMET_phi
    # LHEPart_* (MC only): parton-level truth four-vectors, needed if
    # 005-Unfolding targets parton-level (rather than particle-level) ttbar
    # kinematics -- GenPart* alone is reco-shower-level, not LHE-level.
    - nLHEPart
    - LHEPart_pt
    - LHEPart_eta
    - LHEPart_phi
    - LHEPart_mass
    - LHEPart_incomingpz
    - LHEPart_pdgId
    - LHEPart_status
    - LHEPart_spin
    # GenJet_hadronFlavour/partonFlavour (MC only): truth jet flavor, for
    # b/c-tag SF truth-flavor binning and jet-assignment BDT truth labels.
    # nGenJet: closes a pre-existing gap -- GenJet_pt/eta/phi/mass above were
    # kept as explicit branch names (not a wildcard) without their companion
    # count branch.
    - GenJet_hadronFlavour
    - GenJet_partonFlavour
    - nGenJet
    # TrigObj_*: explicit offline-lepton-to-HLT-object matching, for trigger
    # efficiency SF prescriptions that require object-level matching rather than
    # just the event-level HLT_IsoMu24 flag already covered by "HLT*" above.
    - nTrigObj
    - TrigObj_pt
    - TrigObj_eta
    - TrigObj_phi
    - TrigObj_l1pt
    - TrigObj_l1pt_2
    - TrigObj_l2pt
    - TrigObj_id
    - TrigObj_l1iso
    - TrigObj_l1charge
    - TrigObj_filterBits
